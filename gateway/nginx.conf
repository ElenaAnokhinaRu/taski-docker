server {
    listen 80;
    server_name taskibubu.sytes.net;

    # Автоматический редирект всех пользователей на безопасный HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name taskibubu.sytes.net;

    # Пути к SSL-сертификатам внутри Docker-контейнера
    ssl_certificate /etc/letsencrypt/live/taskibubu.sytes.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taskibubu.sytes.net/privkey.pem;

    location /api/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000/api/;
    }

    location /admin/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000/admin/;
    }

    location / {
        alias /staticfiles/;
        index index.html;
    }
}